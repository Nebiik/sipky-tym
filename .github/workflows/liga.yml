# Čtyřikrát denně stáhne tabulku a rozpis ligy ze sipky.org do souboru data/liga.json.
# Ručně jde spustit v záložce Actions tlačítkem "Run workflow".
name: Liga ze sipky.org

on:
  schedule:
    - cron: "17 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: liga
  cancel-in-progress: false

jobs:
  stahnout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Nainstalovat závislosti
        run: npm install --prefix scripts --no-audit --no-fund

      - name: Stáhnout ligu
        run: node scripts/fetch-liga.mjs

      - name: Uložit změny
        run: |
          if [ -n "$(git status --porcelain data/liga.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/liga.json
            git commit -m "Liga: aktualizace dat ze sipky.org"
            git push
          else
            echo "Beze změny."
          fi
